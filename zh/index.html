<h1>日日撕</h1>
<p class="meta">iPhone 上的撕日曆，看得到國曆、農曆與二十四節氣。</p>
<p>把 iPhone 立在桌上，它就是一本老式日曆。每天撕一張，看今天的日期、農曆和節氣。</p>
<ul>
<li><strong>一天一張。</strong>手指往下拖就能把紙撕下來，有撕紙聲和震動。</li>
<li><strong>農曆與節氣。</strong>每一頁都有農曆月日、干支生肖年，以及當天的節氣，或距離下一個節氣還有幾天。</li>
<li><strong>沒有別的。</strong>沒有廣告、不用帳號、不連網、不收集資料。</li>
</ul>
<p><strong>App Store：</strong>即將上架。</p>
